[package]
name = "cremeplay-app"
version = "1.2.0"
edition = "2024"
authors = ["asheohto"]
license = "MIT"

[[bin]]
name = "cremeplay"
path = "src/main.rs"

[dependencies]
cremeplay-core = { path = "../cremeplay-core" }
rune = { path = "../../../rune-temp/crates/rune" }
rune-kit = { path = "../../../rune-temp/crates/rune-kit" }
rune-motion = { path = "../../../rune-temp/crates/rune-motion" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
image = "0.25"
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
