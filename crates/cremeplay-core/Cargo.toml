[package]
name = "cremeplay-core"
version = "1.2.0"
edition = "2024"
authors = ["asheohto"]
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
rodio = "0.22"
log = "0.4"
sha1 = "0.11"
futures-util = "0.3"
discord-rich-presence = "1.1"
dirs = "6.0"
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-native-roots"] }

